server:
  port: 8080

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

splunk:
  hec:
    url: ${SPLUNK_HEC_URL:http://localhost:8088}
    token: ${SPLUNK_HEC_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/public/**, /api/auth/**, /users/**

        - id: property-service
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/properties/**

        - id: tenant-service
          uri: lb://TENANT-SERVICE
          predicates:
            - Path=/tenants/**