server:
  port: 8080

cors:
  allowed-origin: http://localhost:3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/public/**, /api/auth/**, /users/**

        - id: property-service
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/properties/**

        - id: tenant-service
          uri: lb://TENANT-SERVICE
          predicates:
            - Path=/tenants/**