# Three indexes, one per RentHub data type - kept separate deliberately so
# retention, permissions and volume can each be tuned independently, and so
# SPL exercises in docs/SPLUNK_GUIDE.md can show index=x OR index=y searches.
#
# Shipping this file inside an app is enough for Splunk to create these
# indexes automatically on first start - no separate provisioning step.

[renthub_logs]
homePath   = $SPLUNK_DB/renthub_logs/db
coldPath   = $SPLUNK_DB/renthub_logs/colddb
thawedPath = $SPLUNK_DB/renthub_logs/thaweddb
maxTotalDataSizeMB = 2048
# 14 days - short on purpose for a learning lab; see docs/SPLUNK_GUIDE.md's
# "index lifecycle" section for what this controls (frozen bucket eviction).
frozenTimePeriodInSecs = 1209600

[renthub_events]
homePath   = $SPLUNK_DB/renthub_events/db
coldPath   = $SPLUNK_DB/renthub_events/colddb
thawedPath = $SPLUNK_DB/renthub_events/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 1209600

[renthub_metrics]
homePath   = $SPLUNK_DB/renthub_metrics/db
coldPath   = $SPLUNK_DB/renthub_metrics/colddb
thawedPath = $SPLUNK_DB/renthub_metrics/thaweddb
datatype = metric
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 1209600
