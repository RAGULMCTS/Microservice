# Usage: `... | `renthub_errors`` for all RentHub errors, or
# `... | `renthub_by_service("user-service")`` to scope to one service.
# See docs/SPLUNK_GUIDE.md's macros section.

[renthub_errors]
definition = eventtype=renthub_error

[renthub_by_service(1)]
args = svc
definition = service="$svc$"
iseval = 0
