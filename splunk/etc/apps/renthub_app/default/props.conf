# Two sourcetypes cover every byte RentHub sends to Splunk:
#
#   renthub:service:log  - the full app log (all 6 services), one file each,
#                           tailed by the Universal Forwarder. "service" is a
#                           field *inside* the JSON (written by each
#                           service's logback-spring.xml), not derived from
#                           the file path - simpler index-time story for a
#                           first pass. See docs/SPLUNK_GUIDE.md for a
#                           suggested exercise that extracts it from the path
#                           instead, using SOURCE_KEY, as a next step.
#
#   renthub:appevent     - curated business events sent directly over HEC
#                           (login, registration, property created, gateway
#                           request completed, tenant search).
#
# HEC metrics (index=renthub_metrics) don't need a props.conf stanza: HEC's
# metrics endpoint indexes them structurally, not as text Splunk has to parse.

[renthub:service:log]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
disabled = false
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 100000
category = Structured
pulldown_type = true

[renthub:appevent]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
disabled = false
TRUNCATE = 100000
category = Structured
pulldown_type = true
