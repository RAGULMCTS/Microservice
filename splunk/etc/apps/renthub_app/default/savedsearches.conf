[RentHub - High Error Rate by Service]
search = index=renthub_logs level=ERROR | stats count by service | where count > 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1

[RentHub - Auth Failure Spike]
search = index=renthub_events type=user_login_failure | stats count by username | where count > 3
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1

[RentHub - Daily Request Volume by Route]
search = index=renthub_events type=gateway_request_completed | stats count by path
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
cron_schedule = 0 6 * * *
enableSched = 1
is_scheduled = 1
