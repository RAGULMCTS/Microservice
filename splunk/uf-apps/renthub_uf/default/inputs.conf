# Every RentHub service writes /var/log/renthub/<service-name>/app.log (see each
# module's logback-spring.xml). This one stanza monitors all of them - the
# "service" field distinguishing them is already inside the JSON, not derived
# from the path. See docs/SPLUNK_GUIDE.md for a suggested exercise that adds a
# second, path-derived field as a follow-up.
[monitor:///var/log/renthub/*/app.log]
sourcetype = renthub:service:log
index = renthub_logs
disabled = false
